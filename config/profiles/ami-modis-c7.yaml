# Read existing C7 aerosol granules; never stage into this archive.
# Select with -p ami-modis-c7. All writable paths are beneath data_root.
paths:
  data_root: /CERES/sarb/dfillmor/MODIS_VIIRS
  granule_dir: "/ASDC_archive/MODIS/{platform}/C7/{year}/{doy}"
  granule_pattern: "{short_name}.A{year}{doy}.*.{file_token}.*.nc"
  archive_read_only: true
  manifest: "{data_root}/manifests/{short_name}.{file_token}/manifest_{start}_{end}.tsv"
  output: "{data_root}/grids/{run}/{year}/{month}/{day}/{stem}.{yyyymmdd}.{sssss}.nc"
  summary: "{data_root}/summaries/{run}/summary_{start}_{end}.tsv"
  evaluation_dir: "{data_root}/evaluation/{run}"
  plot: "{data_root}/plots/{run}/{suite}/{name}.{start}-{end}.pdf"
  cartopy_data_dir: "{data_root}/cartopy"
