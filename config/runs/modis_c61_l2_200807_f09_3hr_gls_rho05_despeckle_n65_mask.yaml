# Experimental laptop trial; canonical CAM AOD remains unfiltered.
profile: mac
provenance:
  development_agents:
  - tool: Codex
    provider: OpenAI
    model_name: GPT-6
    model_version: unknown
    reasoning_effort: unknown
    notes: Phase 6 implementation and July 2008 laptop trial; family supplied by session,
      exact snapshot and effort unavailable.
period:
  start: 2008-07-01
  end: 2008-07-31
stage:
  products:
    MOD04_L2:
    - '6.1'
    MYD04_L2:
    - '6.1'
  auth_strategy: netrc
  threads: 8
grid:
  source: f09
  times_per_day: 8
  edge_granules: false
  streams:
    terra_dt:
      product: MOD04_L2
      collection: '6.1'
    terra_db:
      product: MOD04_L2
      collection: '6.1'
    aqua_dt:
      product: MYD04_L2
      collection: '6.1'
    aqua_db:
      product: MYD04_L2
      collection: '6.1'
qc:
  preset: retrieval_team
time:
  leap_seconds: apply
weighting:
  method: gls
  rho: 0.5
  birge: true
  min_pixels: 1
  single_pixel_sigma: floor
output:
  stem: MODIS_VIIRS_AOD_3hr_f09
  clip_negative_mean: true
despeckle:
  enabled: true
  latitude_bands:
  - - 65
    - 90
  radius_km: 150
  aod_min: 0.5
  min_valid_area_fraction: 0.2
  min_valid_neighbors: 5
  spike:
    enabled: true
    mad_multiplier: 3.0
    min_excess: 0.2
    action: mask
plots:
  suites:
  - aod_despeckle_comparison
evaluation:
  aod_variant: unfiltered
  sample_support: available
