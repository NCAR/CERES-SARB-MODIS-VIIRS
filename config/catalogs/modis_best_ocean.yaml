# Retrieval-team QC sensitivity: only MODIS DT ocean AOD uses Best.
products:
  MOD04_L2:
    platform: Terra
    instrument: MODIS
    provider: LAADS
    stream_prefix: terra
    collections:
      '6.1':
        cmr_version: '6.1'
        file_token: '061'
        file_format: hdf4
        geolocation:
          lat: Latitude
          lon: Longitude
          time: Scan_Start_Time
          time_kind: tai93
        algorithms:
          dt:
            family: modis_dt
            surfaces:
              land:
                aod:
                  name: Corrected_Optical_Depth_Land
                  select:
                    Solution_3_Land:mod04: 1
                qa:
                  name: Land_Ocean_Quality_Flag
                  select: null
                sigma: null
              ocean:
                aod:
                  name: Effective_Optical_Depth_Best_Ocean
                  select: &id001
                    MODIS_Band_Ocean:mod04: 1
                qa:
                  name: Land_Ocean_Quality_Flag
                  select: null
                sigma: null
            alternates:
              cam7_v2:
                ocean:
                  aod:
                    name: Effective_Optical_Depth_Best_Ocean
                    select: *id001
                  qa:
                    name: Land_Ocean_Quality_Flag
                    select: null
                  sigma: null
          db:
            family: modis_db
            surfaces:
              land:
                aod:
                  name: Deep_Blue_Aerosol_Optical_Depth_550_Land
                  select: null
                qa:
                  name: Deep_Blue_Aerosol_Optical_Depth_550_Land_QA_Flag
                  select: null
                sigma:
                  name: Deep_Blue_Aerosol_Optical_Depth_550_Land_Estimated_Uncertainty
                  select: null
            alternates: {}
      '7':
        cmr_version: '7'
        file_token: '007'
        file_format: netcdf4
        geolocation: null
        algorithms: {}
