[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sarb-aod"
version = "0.1.0"
description = "MODIS/VIIRS L2 aerosol preprocessing into CAM7-ready AOD constraint files for CERES-SARB"
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.11"
authors = [{name = "David Fillmore"}]
dependencies = [
    "numpy>=1.24",
    "numba>=0.60",
    "xarray>=2023.1",
    "netCDF4>=1.6",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "typer>=0.9",
    "rich>=13.0",
    "earthaccess>=0.11",
]

[project.optional-dependencies]
hdf4 = ["pyhdf"]
dev = ["pytest>=7.0", "pytest-cov>=4.0", "mypy>=1.0", "black>=23.0", "isort>=5.12"]

[project.scripts]
sarb-aod = "sarb_aod.cli:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["sarb_aod*"]

[tool.setuptools.package-data]
sarb_aod = ["py.typed", "data/*.yaml"]

[tool.black]
line-length = 100
target-version = ["py311", "py312", "py313"]

[tool.isort]
profile = "black"
line_length = 100

[tool.mypy]
python_version = "3.13"
check_untyped_defs = true
disallow_incomplete_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = [
    "earthaccess.*",
    "pyhdf.*",
    "netCDF4.*",
    "yaml.*",
    "numba.*",
    "pandas.*",
    "cartopy.*",
    "shapely.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
markers = [
    "network: tests that reach NASA CMR/LAADS or AERONET (deselect with -m 'not network')",
    "real_data: tests that read staged L2 granules; skipped when the profile's data_root has none",
]
