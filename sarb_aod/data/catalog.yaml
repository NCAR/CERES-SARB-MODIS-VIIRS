# Product catalog: L2 aerosol products and their processing collections.
#
# Collection keys equal the CMR VersionId. Fields:
#   cmr_version  CMR/earthaccess VersionId (MODIS C6.1 is "6.1", not "61")
#   file_token   version token embedded in granule filenames (".061.", ".007.", ".021.")
#   file_format  on-disk format, used for integrity checks and reader dispatch
#   stream_prefix  platform prefix of each algorithm stream, e.g. terra_dt
#   geolocation/algorithms  verified reader recipe; absent until product activation
#
# Availability notes (CMR/LAADS, verified 2026-10-10):
# - MODIS C7: CMR "7", token "007", NetCDF4. LAADS publishes only C7 L1B/geolocation
#   (MOD02*/MOD03) at that check. AMI C7 aerosol samples verified 2026-10-11
#   independently of public CMR availability; see docs/MODIS_C7.md.
# - VIIRS Deep Blue v2.1 (token "021"): NOAA-20 reprocessed back to 2018; SNPP v2.1
#   covers only 2026-06 onward, so SNPP history needs v2 (token "002").
# - VIIRS Dark Target: v2.1 only.

products:
  MOD04_L2:
    platform: Terra
    instrument: MODIS
    provider: LAADS
    stream_prefix: terra
    collections:
      "6.1": &modis_c61
        cmr_version: "6.1"
        file_token: "061"
        file_format: hdf4
        geolocation: {lat: Latitude, lon: Longitude, time: Scan_Start_Time, time_kind: tai93}
        algorithms:
          dt:
            family: modis_dt
            surfaces:
              land:
                aod:
                  name: Corrected_Optical_Depth_Land
                  select: {"Solution_3_Land:mod04": 1}
                qa: {name: Land_Ocean_Quality_Flag}
              ocean:
                aod:
                  name: Effective_Optical_Depth_Average_Ocean
                  select: {"MODIS_Band_Ocean:mod04": 1}
                qa: {name: Land_Ocean_Quality_Flag}
            alternates:
              cam7_v2:
                ocean:
                  aod:
                    name: Effective_Optical_Depth_Best_Ocean
                    select: {"MODIS_Band_Ocean:mod04": 1}
                  qa: {name: Land_Ocean_Quality_Flag}
          db:
            family: modis_db
            surfaces:
              land:
                aod: {name: Deep_Blue_Aerosol_Optical_Depth_550_Land}
                qa: {name: Deep_Blue_Aerosol_Optical_Depth_550_Land_QA_Flag}
                sigma: {name: Deep_Blue_Aerosol_Optical_Depth_550_Land_Estimated_Uncertainty}
      "7": &modis_c7
        cmr_version: "7"
        file_token: "007"
        file_format: netcdf4
        geolocation:
          lat: geolocation_data/Latitude
          lon: geolocation_data/Longitude
          time: geophysical_data_Deep_Blue/Scan_Start_Time
          time_kind: tai93
        algorithms:
          dt:
            family: modis_dt
            surfaces:
              land:
                aod:
                  name: geophysical_data_Dark_Target/Corrected_Optical_Depth_Land
                  select: {Wavelength_Used_Land_2: 1}
                qa: {name: geophysical_data_Dark_Target/Land_Ocean_Quality_Flag}
              ocean:
                aod:
                  name: geophysical_data_Dark_Target/Effective_Optical_Depth_Average_Ocean
                  select: {Wavelength_Used_ALL: 1}
                qa: {name: geophysical_data_Dark_Target/Land_Ocean_Quality_Flag}
          db:
            family: modis_db
            surfaces:
              land:
                aod: {name: geophysical_data_Deep_Blue/Aerosol_Optical_Thickness_550_Land}
                qa: {name: geophysical_data_Deep_Blue/Aerosol_Optical_Thickness_QA_Flag_Land}
                sigma: {name: geophysical_data_Deep_Blue/Aerosol_Optical_Thickness_550_Expected_Uncertainty_Land}
              ocean:
                aod: {name: geophysical_data_Deep_Blue/Aerosol_Optical_Thickness_550_Ocean}
                qa: {name: geophysical_data_Deep_Blue/Aerosol_Optical_Thickness_QA_Flag_Ocean}
                sigma: {name: geophysical_data_Deep_Blue/Aerosol_Optical_Thickness_550_Expected_Uncertainty_Ocean}
        combined_product:
          aod: {name: geophysical_data_Dark_Target_Deep_Blue_Combined/AOD_550_Dark_Target_Deep_Blue_Combined_Land_Ocean}
          qa: {name: geophysical_data_Dark_Target_Deep_Blue_Combined/AOD_550_Dark_Target_Deep_Blue_Combined_QA_Flag_Land_Ocean}
          algorithm_flag: {name: geophysical_data_Dark_Target_Deep_Blue_Combined/AOD_550_Dark_Target_Deep_Blue_Combined_Algorithm_Flag_Land_Ocean}
  MYD04_L2:
    platform: Aqua
    instrument: MODIS
    provider: LAADS
    stream_prefix: aqua
    collections:
      # Aqua C6.1 also uses the :mod04 dimension suffix (verified on staged granules).
      "6.1": *modis_c61
      "7": *modis_c7
  AERDB_L2_VIIRS_SNPP:
    platform: SNPP
    instrument: VIIRS
    provider: LAADS
    stream_prefix: snpp
    collections:
      "2": &viirs_db_v2
        cmr_version: "2"
        file_token: "002"
        file_format: netcdf4
        geolocation: &viirs_db_geo
          {lat: Latitude, lon: Longitude, time: Scan_Start_Time, time_kind: tai93}
        algorithms: &viirs_db_algorithms
          db:
            family: viirs_db
            surfaces:
              land:
                aod: {name: Aerosol_Optical_Thickness_550_Land}
                qa: {name: Aerosol_Optical_Thickness_QA_Flag_Land}
                sigma: {name: Aerosol_Optical_Thickness_550_Expected_Uncertainty_Land}
              ocean:
                aod: {name: Aerosol_Optical_Thickness_550_Ocean}
                qa: {name: Aerosol_Optical_Thickness_QA_Flag_Ocean}
                sigma: {name: Aerosol_Optical_Thickness_550_Expected_Uncertainty_Ocean}
      "2.1": &viirs_db_v21
        cmr_version: "2.1"
        file_token: "021"
        file_format: netcdf4
        geolocation: *viirs_db_geo
        algorithms: *viirs_db_algorithms
  AERDB_L2_VIIRS_NOAA20:
    platform: NOAA-20
    instrument: VIIRS
    provider: LAADS
    stream_prefix: noaa20
    collections:
      "2": *viirs_db_v2
      "2.1": *viirs_db_v21
  AERDT_L2_VIIRS_SNPP:
    platform: SNPP
    instrument: VIIRS
    provider: LAADS
    stream_prefix: snpp
    collections:
      "2.1": &viirs_dt_v21
        cmr_version: "2.1"
        file_token: "021"
        file_format: netcdf4
        geolocation:
          lat: geolocation_data/latitude
          lon: geolocation_data/longitude
          time: null
          time_kind: coverage_attrs
        algorithms:
          dt:
            family: viirs_dt
            surfaces:
              land:
                aod:
                  name: geophysical_data/Corrected_Optical_Depth_Land
                  select: {Wavelength_Used_Land_2: 1}
                qa: {name: geophysical_data/Land_Ocean_Quality_Flag}
              ocean:
                aod:
                  name: geophysical_data/Effective_Optical_Depth_Average_Ocean
                  select: {Wavelength_Used_ALL: 1}
                qa: {name: geophysical_data/Land_Ocean_Quality_Flag}
  AERDT_L2_VIIRS_NOAA20:
    platform: NOAA-20
    instrument: VIIRS
    provider: LAADS
    stream_prefix: noaa20
    collections:
      "2.1": *viirs_dt_v21
